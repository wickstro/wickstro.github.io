<title>Dr Hardman</title>

<style>
  html, body { margin: 0; height: 100%; background: #131314; }
  body { display: grid; place-items: center; }
  svg { width: min(94vw, 94vh); height: auto; cursor: pointer; }

  /* Speech bubble: hidden until the logo is hovered (or tapped on a phone) */
  #bubble { opacity: 0; transform: translateY(6px) scale(.96); transform-box: fill-box; transform-origin: 20% 100%;
            transition: opacity .25s, transform .25s; pointer-events: none; }
  #bubble text { font: 600 13px 'Source Sans 3', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #131314; }
  svg:hover #bubble, svg.talk #bubble { opacity: 1; transform: none; }

  /* Wave: three waves, then rest. Pivot = elbow (188,84). */
  #forearm {
    transform-box: view-box;
    transform-origin: 188px 84px;
    animation: wave 3.2s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10%, 30%, 50% { transform: rotate(22deg); }
    20%, 40%      { transform: rotate(-12deg); }
  }

  /* Occasional blink */
  #eye_R, #eye_D { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
</style>

<script>
  const svg = document.querySelector('svg');

  // Each pupil moves inside its eye white, like xeyes.
  const eyes = ['R', 'D'].map(id => {
    const pupil = document.getElementById('pupil_' + id);
    const b = document.getElementById('eye_' + id + '_white').getBBox();
    const r = +pupil.getAttribute('r');
    return { pupil, cx: b.x + b.width / 2, cy: b.y + b.height / 2,
             rx: b.width / 2 - r - 1, ry: b.height / 2 - r - 1 };
  });

  function look(clientX, clientY) {
    const pt = new DOMPoint(clientX, clientY).matrixTransform(svg.getScreenCTM().inverse());
    for (const e of eyes) {
      const dx = pt.x - e.cx, dy = pt.y - e.cy;
      const k = Math.min(1, 1 / (Math.hypot(dx / e.rx, dy / e.ry) || 1));  // stay inside the eye
      e.pupil.setAttribute('cx', e.cx + dx * k);
      e.pupil.setAttribute('cy', e.cy + dy * k);
    }
  }
  addEventListener('pointermove', ev => look(ev.clientX, ev.clientY));
  // Phones have no hover: a tap shows the bubble, the next tap hides it.
  svg.addEventListener('click', () => svg.classList.toggle('talk'));
</script>
